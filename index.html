<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>Cosmic Task Brain — Spatial Fixture</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:#eef4ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
body,#app,canvas{touch-action:none}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 45%,#08111f 0,#030711 48%,#010207 100%);user-select:none;-webkit-user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));z-index:2;pointer-events:none}
#title{font-size:12px;font-weight:800;letter-spacing:.16em}
#status{margin-top:5px;font-size:12px;color:#9ba9bc}
#scale{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#aebbd0;z-index:2;pointer-events:none}
#hint{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(94%,650px);padding:9px 13px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(3,7,17,.68);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-align:center;font-size:12px;color:#bdc8d8;z-index:2;pointer-events:none}
</style>
</head>
<body>
<div id="app">
<canvas id="space"></canvas>
<div id="hud"><div id="title">COSMIC TASK BRAIN · FIXTURE 11</div><div id="status">Trackpad: 2-finger slide pans · pinch zooms · Touch: drag pans · pinch zooms</div></div>
<div id="scale">1.00×</div>
<div id="hint">REAL-IMAGE TEST · pan, then dive into Earth, Mars, or Jupiter</div>
</div>
<script>
(()=>{
"use strict";
const app=document.getElementById("app"), canvas=document.getElementById("space"), ctx=canvas.getContext("2d"), scaleEl=document.getElementById("scale");
let dpr=1,W=0,H=0,zoom=.72,camX=0,camY=0,initialized=false;
const MIN=.10,MAX=90;
const planets=[
{x:145,y:-82,r:12,c:"#9b948a",n:"Mercury"},{x:-205,y:105,r:17,c:"#c48958",n:"Venus"},
{x:115,y:215,r:20,c:"#5e91b1",n:"Earth"},{x:-320,y:-145,r:16,c:"#a85e49",n:"Mars"},
{x:410,y:145,r:35,c:"#c49a70",n:"Jupiter"},{x:-480,y:210,r:28,c:"#c9b78d",ring:1,n:"Saturn"},
{x:515,y:-270,r:24,c:"#73aab0",n:"Uranus"},{x:-625,y:-255,r:23,c:"#5273ad",n:"Neptune"},
{x:690,y:300,r:12,c:"#8c7467",n:"Pluto"}];
const orbits=[[165,105,-.18],[245,150,.14],[335,205,-.31],[430,255,.23],[535,315,-.12],[655,380,.28],[760,440,-.21]];
let seed=1337;const stars=[];function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<450;i++)stars.push({x:(rnd()-.5)*4000,y:(rnd()-.5)*3000,r:.4+rnd()*1.4,a:.18+rnd()*.7});
const w2s=(x,y)=>({x:x*zoom+camX,y:y*zoom+camY});
const s2w=(x,y)=>({x:(x-camX)/zoom,y:(y-camY)/zoom});
function resize(){dpr=Math.min(3,devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0);if(!initialized){camX=W/2;camY=H/2;initialized=true}draw()}


const photoAssets={
 earthSpace:"https://assets.science.nasa.gov/dynamicimage/assets/science/esd/climate/2023/12/ImageWall5_1920x1200-80.jpg?crop=faces%2Cfocalpoint&fit=clip&h=1200&w=1920",
 earthClouds:"https://eol.jsc.nasa.gov/Collections/EarthArt/img/Canada-Yukon/ISS048-E-20277-20281_preview.jpg",
 earthLand:"https://eol.jsc.nasa.gov/Collections/EarthArt/img/Patagonia-lakes/ISS055-E-64497_preview.jpg",
 mars:"https://d2pn8kiwq2w21t.cloudfront.net/original_images/jpegPIA24422.jpg",
 jupiter:"https://assets.science.nasa.gov/dynamicimage/assets/science/cds/general/images/2024/03/pia21770large.jpg?crop=faces%2Cfocalpoint&fit=clip&h=1280&w=1920"
};
const photos={};
for(const [k,u] of Object.entries(photoAssets)){let im=new Image();im.crossOrigin="anonymous";im.src=u;photos[k]=im}
function photoCover(im,a,scale=1,panX=0,panY=0){
 if(!im||!im.complete||!im.naturalWidth)return false;
 ctx.save();ctx.globalAlpha=a;
 const s=Math.max(W/im.naturalWidth,H/im.naturalHeight)*scale;
 const dw=im.naturalWidth*s,dh=im.naturalHeight*s;
 ctx.drawImage(im,(W-dw)/2+panX,(H-dh)/2+panY,dw,dh);
 ctx.restore();return true
}
function vignette(a){
 ctx.save();ctx.globalAlpha=a;let g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.72);
 g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.72)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore()
}

function smooth(a,b,x){let t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)}
function focusedPlanet(){
  let best=null, bd=1e9;
  for(const p of planets){
    const q=w2s(p.x,p.y), d=Math.hypot(q.x-W/2,q.y-H/2);
    if(d<bd){bd=d;best={p,q,d}}
  }
  return best;
}
function sceneAlpha(z,a,b,c,d){
  return smooth(a,b,z)*(1-smooth(c,d,z));
}
function fillScene(col,a){ctx.save();ctx.globalAlpha=a;ctx.fillStyle=col;ctx.fillRect(0,0,W,H);ctx.restore()}
function sceneLabel(t,a,sub=""){
  if(a<.05)return;
  ctx.save();ctx.globalAlpha=a;ctx.textAlign="center";ctx.fillStyle="rgba(255,255,255,.94)";
  ctx.font="700 13px -apple-system,BlinkMacSystemFont,sans-serif";ctx.fillText(t,W/2,38);
  if(sub){ctx.globalAlpha=a*.72;ctx.font="500 10px -apple-system,BlinkMacSystemFont,sans-serif";ctx.fillText(sub,W/2,56)}
  ctx.restore();
}
function clouds(a,col="rgba(255,255,255,.72)"){
  ctx.save();ctx.globalAlpha=a;ctx.fillStyle=col;
  for(let i=0;i<9;i++){
    const x=(i*173+W*.08)%W, y=H*(.12+(i%4)*.13);
    ctx.beginPath();ctx.ellipse(x,y,70+(i%3)*30,18+(i%2)*9,.08*(i%2),0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+42,y-9,50,15,0,0,Math.PI*2);ctx.fill();
  }ctx.restore()
}
function mountains(a,back,front){
  ctx.save();ctx.globalAlpha=a;ctx.fillStyle=back;ctx.beginPath();ctx.moveTo(0,H*.64);
  for(let x=0;x<=W;x+=70)ctx.lineTo(x,H*.55-Math.abs(Math.sin(x*.013))*85);
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  ctx.fillStyle=front;ctx.beginPath();ctx.moveTo(0,H*.73);
  for(let x=0;x<=W;x+=55)ctx.lineTo(x,H*.69-Math.abs(Math.sin(x*.019+1))*48);
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.restore()
}
function trees(a){
  ctx.save();ctx.globalAlpha=a;
  for(let i=0;i<18;i++){let x=(i*89+31)%W,y=H*.72+(i%4)*13;
    ctx.fillStyle="#3a2b20";ctx.fillRect(x-3,y-30,6,32);
    ctx.fillStyle=i%2?"#244f2d":"#315f36";
    ctx.beginPath();ctx.moveTo(x,y-72);ctx.lineTo(x-25,y-25);ctx.lineTo(x+25,y-25);ctx.closePath();ctx.fill()
  }ctx.restore()
}
function strata(a,kind){
  ctx.save();ctx.globalAlpha=a;
  const cols=kind==="ice"?["#b9d8df","#7ba8b4","#4e7180","#8b8176"]:
    kind==="gas"?["#b88761","#98684e","#655b62","#424a61"]:
    ["#72503b","#9b5737","#c46b38","#e09a4c","#f0c66a"];
  const h=H/cols.length;
  cols.forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(0,i*h,W,h+1);
    ctx.globalAlpha=a*.22;ctx.strokeStyle="#fff";ctx.beginPath();
    for(let x=0;x<=W;x+=45)ctx.lineTo(x,i*h+h*.52+Math.sin(x*.02+i)*8);
    ctx.stroke();ctx.globalAlpha=a;
  });ctx.restore()
}
function worldScenes(p,q){
 const z=zoom,name=p.n;
 if(z<4.4)return;
 const cover=smooth(4.4,6.2,z); fillScene("#020305",cover);

 if(name==="Earth"){
   let a=sceneAlpha(z,4.4,5.5,8.0,9.8);
   photoCover(photos.earthSpace,a,1.0+Math.max(0,z-4.4)*.055); vignette(a*.28);
   sceneLabel("EARTH · APPROACH",a,"real NASA imagery");

   a=sceneAlpha(z,8.0,9.8,13.5,15.5);
   photoCover(photos.earthClouds,a,1.05+Math.max(0,z-8)*.035,0,(z-8)*-2); vignette(a*.16);
   sceneLabel("EARTH · ATMOSPHERE",a,"clouds and terrain replace the globe");

   a=sceneAlpha(z,13.5,15.5,21.0,23.5);
   photoCover(photos.earthLand,a,1.12+Math.max(0,z-13.5)*.045,0,(z-13.5)*-3); vignette(a*.2);
   sceneLabel("EARTH · LANDSCAPE",a,"the previous layer is gone");

   a=sceneAlpha(z,21,23.5,32,35);strata(a,"rock");sceneLabel("EARTH · CRUST + MANTLE",a);
   a=smooth(32,36,z);fillScene("#6d2418",a);ctx.save();ctx.globalAlpha=a;let g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.min(W,H)*.4);g.addColorStop(0,"#fff0a5");g.addColorStop(.35,"#f2a13b");g.addColorStop(1,"#6d2418");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();sceneLabel("EARTH · CORE",a);
 } else if(name==="Mars"){
   let a=sceneAlpha(z,4.4,5.5,9.5,11.5);
   photoCover(photos.mars,a,1.0+Math.max(0,z-4.4)*.035);vignette(a*.28);sceneLabel("MARS · DESCENT",a,"NASA Perseverance panorama");
   a=sceneAlpha(z,9.5,11.5,22,25);photoCover(photos.mars,a,1.35+Math.max(0,z-9.5)*.065,0,(z-10)*-4);vignette(a*.18);sceneLabel("MARS · SURFACE",a,"real Martian terrain");
   a=sceneAlpha(z,22,25,33,36);strata(a,"rock");sceneLabel("MARS · INTERIOR",a);
   a=smooth(33,38,z);fillScene("#6d3328",a);sceneLabel("MARS · CORE REGION",a);
 } else if(name==="Jupiter"){
   let a=sceneAlpha(z,4.4,5.5,12,14);
   photoCover(photos.jupiter,a,1.0+Math.max(0,z-4.4)*.04);vignette(a*.22);sceneLabel("JUPITER · CLOUD TOPS",a,"NASA Juno imagery");
   a=sceneAlpha(z,12,14,25,28);photoCover(photos.jupiter,a,1.65+Math.max(0,z-12)*.08,(z-12)*-5,(z-12)*-3);vignette(a*.12);sceneLabel("JUPITER · INTO THE STORMS",a,"cloud structure becomes the environment");
   a=sceneAlpha(z,25,28,35,38);strata(a,"gas");sceneLabel("JUPITER · DEEP ATMOSPHERE",a);
   a=smooth(35,40,z);fillScene("#3c3439",a);sceneLabel("JUPITER · DEEP INTERIOR",a);
 } else {
   let a=sceneAlpha(z,4.4,5.5,14,17);fillScene("#11151c",a);sceneLabel(name+" · REAL-IMAGE LAYER NOT YET WIRED",a,"Fixture 11 is validating the visual engine on Earth, Mars, and Jupiter");
   a=smooth(14,18,z);strata(a,(name==="Uranus"||name==="Neptune")?"ice":"rock");sceneLabel(name+" · INTERIOR TEST",a);
 }
}
function draw(){
ctx.clearRect(0,0,W,H);ctx.fillStyle="#02040a";ctx.fillRect(0,0,W,H);
for(const s of stars){const p=w2s(s.x,s.y);if(p.x<-4||p.x>W+4||p.y<-4||p.y>H+4)continue;ctx.globalAlpha=s.a;ctx.fillStyle="#edf5ff";ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.4,s.r*Math.min(1.3,Math.sqrt(zoom))),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
const c=w2s(0,0);ctx.save();ctx.translate(c.x,c.y);for(const [rx,ry,rot] of orbits){ctx.save();ctx.rotate(rot);ctx.strokeStyle="rgba(126,151,184,.22)";ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(0,0,rx*zoom,ry*zoom,0,0,Math.PI*2);ctx.stroke();ctx.restore()}ctx.restore();
const sr=Math.max(3,52*zoom),g=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,sr*2.3);g.addColorStop(0,"rgba(255,213,92,.95)");g.addColorStop(.4,"rgba(244,168,52,.8)");g.addColorStop(1,"rgba(244,168,52,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(c.x,c.y,sr*2.3,0,Math.PI*2);ctx.fill();ctx.fillStyle="#f3b743";ctx.beginPath();ctx.arc(c.x,c.y,sr,0,Math.PI*2);ctx.fill();
for(const p of planets){const q=w2s(p.x,p.y),r=Math.max(3,p.r*zoom);if(q.x+r*3<0||q.x-r*3>W||q.y+r*3<0||q.y-r*3>H)continue;if(p.ring){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(-.22);ctx.strokeStyle="rgba(213,196,153,.72)";ctx.lineWidth=Math.max(1,5*zoom);ctx.beginPath();ctx.ellipse(0,0,r*1.8,r*.55,0,0,Math.PI*2);ctx.stroke();ctx.restore()}const pg=ctx.createRadialGradient(q.x-r*.3,q.y-r*.35,r*.05,q.x,q.y,r);pg.addColorStop(0,"#e9f0f5");pg.addColorStop(.18,p.c);pg.addColorStop(1,"#17202b");ctx.save();ctx.globalAlpha=1-smooth(4.6,7.0,zoom);ctx.fillStyle=pg;ctx.beginPath();ctx.arc(q.x,q.y,r,0,Math.PI*2);ctx.fill();ctx.restore();if(zoom>1.7&&zoom<6.8){ctx.save();ctx.globalAlpha=1-smooth(5.0,6.8,zoom);ctx.fillStyle="rgba(230,239,250,.82)";ctx.font="600 12px -apple-system,sans-serif";ctx.textAlign="center";ctx.fillText(p.n,q.x,q.y+r+18);ctx.restore()}}
const fp=focusedPlanet();if(fp)worldScenes(fp.p,fp.q);
scaleEl.textContent=zoom.toFixed(2)+"×";
}
const pointers=new Map();let drag=null,pinch=null;
function mid(){const a=[...pointers.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}
function dist(){const a=[...pointers.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}
app.addEventListener("pointerdown",e=>{e.preventDefault();try{app.setPointerCapture(e.pointerId)}catch(_){}pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)drag={x:e.clientX,y:e.clientY,cx:camX,cy:camY};else if(pointers.size===2){const m=mid();pinch={d:dist(),z:zoom,a:s2w(m.x,m.y)};drag=null}},{passive:false});
app.addEventListener("pointermove",e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&drag){camX=drag.cx+e.clientX-drag.x;camY=drag.cy+e.clientY-drag.y;draw()}else if(pointers.size===2&&pinch){const m=mid(),nz=Math.max(MIN,Math.min(MAX,pinch.z*dist()/Math.max(1,pinch.d)));zoom=nz;camX=m.x-pinch.a.x*zoom;camY=m.y-pinch.a.y*zoom;draw()}},{passive:false});
function end(e){if(!pointers.has(e.pointerId))return;e.preventDefault();pointers.delete(e.pointerId);if(pointers.size===1){const p=[...pointers.values()][0];drag={x:p.x,y:p.y,cx:camX,cy:camY};pinch=null}else{drag=null;pinch=null}}
app.addEventListener("pointerup",end,{passive:false});app.addEventListener("pointercancel",end,{passive:false});

/*
 Mac trackpad:
 Safari emits ordinary two-finger scrolling as wheel events with ctrlKey=false.
 Trackpad pinch-to-zoom is exposed as wheel events with ctrlKey=true.
 Treat them as DIFFERENT spatial axes.
*/
app.addEventListener("wheel",e=>{
e.preventDefault();
if(e.ctrlKey){
  const anchor=s2w(e.clientX,e.clientY);
  const factor=Math.exp(-e.deltaY*.012);
  zoom=Math.max(MIN,Math.min(MAX,zoom*factor));
  camX=e.clientX-anchor.x*zoom;
  camY=e.clientY-anchor.y*zoom;
}else{
  // Natural "grab the field" behavior: content follows the trackpad gesture.
  camX-=e.deltaX;
  camY-=e.deltaY;
}
draw();
},{passive:false});

// Safari/macOS trackpad pinch support.
// Safari exposes trackpad pinch through gesturestart/gesturechange.
// Keep the world point under the gesture center fixed while scale changes.
let safariGesture = null;

document.addEventListener("gesturestart", e => {
  e.preventDefault();
  const x = (typeof e.clientX === "number" && e.clientX) ? e.clientX : W / 2;
  const y = (typeof e.clientY === "number" && e.clientY) ? e.clientY : H / 2;
  safariGesture = {
    startZoom: zoom,
    anchor: s2w(x, y),
    x, y
  };
}, {passive:false});

document.addEventListener("gesturechange", e => {
  e.preventDefault();
  if (!safariGesture) return;
  const x = (typeof e.clientX === "number" && e.clientX) ? e.clientX : safariGesture.x;
  const y = (typeof e.clientY === "number" && e.clientY) ? e.clientY : safariGesture.y;
  zoom = Math.max(MIN, Math.min(MAX, safariGesture.startZoom * e.scale));
  camX = x - safariGesture.anchor.x * zoom;
  camY = y - safariGesture.anchor.y * zoom;
  draw();
}, {passive:false});

document.addEventListener("gestureend", e => {
  e.preventDefault();
  safariGesture = null;
}, {passive:false});
app.addEventListener("contextmenu",e=>e.preventDefault());
addEventListener("resize",resize,{passive:true});resize();
})();
</script>
</body>
</html>
