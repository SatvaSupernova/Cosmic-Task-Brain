<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>Cosmic Task Brain — Spatial Fixture</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:#eef4ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
  body{touch-action:none}
  #app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 45%,#08111f 0,#030711 48%,#010207 100%);touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #hud{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));z-index:2;pointer-events:none}
  #title{font-size:12px;font-weight:800;letter-spacing:.16em}
  #status{margin-top:5px;font-size:12px;color:#9ba9bc}
  #scale{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#aebbd0;z-index:2;pointer-events:none}
  #hint{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92%,520px);padding:9px 13px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(3,7,17,.68);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-align:center;font-size:12px;color:#bdc8d8;z-index:2;pointer-events:none}
  #cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;border:1px solid rgba(255,255,255,.24);pointer-events:none;z-index:2}
</style>
</head>
<body>
<div id="app">
  <canvas id="space"></canvas>
  <div id="hud"><div id="title">COSMIC TASK BRAIN · FIXTURE 01</div><div id="status">1 finger: pan · 2 fingers: zoom toward them</div></div>
  <div id="scale">1.00×</div>
  <div id="cross"></div>
  <div id="hint">Put two fingers over any planet and spread. That planet should stay under your fingers.</div>
</div>
<script>
(() => {
  "use strict";
  const app = document.getElementById("app");
  const canvas = document.getElementById("space");
  const ctx = canvas.getContext("2d");
  const scaleEl = document.getElementById("scale");

  let dpr = Math.min(3, window.devicePixelRatio || 1);
  let W=0,H=0;

  // Camera maps world -> screen:
  // screenX = worldX * zoom + camX
  // screenY = worldY * zoom + camY
  let zoom = 0.72, camX = 0, camY = 0;
  const MIN_ZOOM=.18, MAX_ZOOM=28;

  const sun={x:0,y:0,r:52};
  const planets=[
    {x:145,y:-82,r:12,c:"#9b948a",name:"P1"},
    {x:-205,y:105,r:17,c:"#c48958",name:"P2"},
    {x:115,y:215,r:20,c:"#5e91b1",name:"P3"},
    {x:-320,y:-145,r:16,c:"#a85e49",name:"P4"},
    {x:410,y:145,r:35,c:"#c49a70",name:"P5"},
    {x:-480,y:210,r:28,c:"#c9b78d",ring:true,name:"P6"},
    {x:515,y:-270,r:24,c:"#73aab0",name:"P7"},
    {x:-625,y:-255,r:23,c:"#5273ad",name:"P8"},
    {x:690,y:300,r:12,c:"#8c7467",name:"P9"}
  ];
  const orbits=[
    [165,105,-.18],[245,150,.14],[335,205,-.31],[430,255,.23],[535,315,-.12],[655,380,.28],[760,440,-.21]
  ];
  const stars=[];
  let seed=1337;
  function rnd(){ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; }
  for(let i=0;i<420;i++) stars.push({x:(rnd()-.5)*3600,y:(rnd()-.5)*2600,r:.45+rnd()*1.4,a:.18+rnd()*.68});

  function resize(){
    dpr=Math.min(3,window.devicePixelRatio||1);
    W=app.clientWidth; H=app.clientHeight;
    canvas.width=Math.max(1,Math.round(W*dpr));
    canvas.height=Math.max(1,Math.round(H*dpr));
    canvas.style.width=W+"px";canvas.style.height=H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(!resize.initialized){
      camX=W/2;camY=H/2;resize.initialized=true;
    }
    draw();
  }

  function worldToScreen(x,y){return{x:x*zoom+camX,y:y*zoom+camY};}
  function screenToWorld(x,y){return{x:(x-camX)/zoom,y:(y-camY)/zoom};}

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle="#02040a";ctx.fillRect(0,0,W,H);

    // Stars are true world objects, reinforcing movement.
    for(const s of stars){
      const p=worldToScreen(s.x,s.y);
      if(p.x<-5||p.x>W+5||p.y<-5||p.y>H+5) continue;
      ctx.globalAlpha=s.a;ctx.fillStyle="#eaf2ff";
      ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.45,s.r*Math.min(1.35,Math.sqrt(zoom))),0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;

    const center=worldToScreen(0,0);
    ctx.save();ctx.translate(center.x,center.y);
    for(const [rx,ry,rot] of orbits){
      ctx.save();ctx.rotate(rot);ctx.strokeStyle="rgba(126,151,184,.22)";ctx.lineWidth=1;
      ctx.beginPath();ctx.ellipse(0,0,rx*zoom,ry*zoom,0,0,Math.PI*2);ctx.stroke();ctx.restore();
    }
    ctx.restore();

    // Sun
    const sp=worldToScreen(sun.x,sun.y), sr=Math.max(3,sun.r*zoom);
    const glow=ctx.createRadialGradient(sp.x,sp.y,0,sp.x,sp.y,sr*2.3);
    glow.addColorStop(0,"rgba(255,213,92,.95)");glow.addColorStop(.38,"rgba(244,168,52,.82)");glow.addColorStop(1,"rgba(244,168,52,0)");
    ctx.fillStyle=glow;ctx.beginPath();ctx.arc(sp.x,sp.y,sr*2.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#f3b743";ctx.beginPath();ctx.arc(sp.x,sp.y,sr,0,Math.PI*2);ctx.fill();

    // Planets
    for(const p of planets){
      const q=worldToScreen(p.x,p.y), r=Math.max(3,p.r*zoom);
      if(q.x+r*3<0||q.x-r*3>W||q.y+r*3<0||q.y-r*3>H) continue;
      if(p.ring){
        ctx.save();ctx.translate(q.x,q.y);ctx.rotate(-.22);ctx.strokeStyle="rgba(213,196,153,.72)";ctx.lineWidth=Math.max(1,5*zoom);ctx.beginPath();ctx.ellipse(0,0,r*1.8,r*.55,0,0,Math.PI*2);ctx.stroke();ctx.restore();
      }
      const g=ctx.createRadialGradient(q.x-r*.32,q.y-r*.35,r*.05,q.x,q.y,r);
      g.addColorStop(0,"#e9f0f5");g.addColorStop(.18,p.c);g.addColorStop(1,"#17202b");
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(q.x,q.y,r,0,Math.PI*2);ctx.fill();

      // Labels only become useful when close enough.
      if(zoom>1.7){
        ctx.fillStyle="rgba(230,239,250,.82)";
        ctx.font=`600 ${Math.min(16,10+zoom*.45)}px -apple-system,BlinkMacSystemFont,sans-serif`;
        ctx.textAlign="center";ctx.fillText(p.name,q.x,q.y+r+18);
      }
      // Semantic detail emerges instead of switching pages.
      if(zoom>6){
        ctx.strokeStyle="rgba(255,255,255,.22)";ctx.lineWidth=1.5;
        ctx.beginPath();ctx.arc(q.x,q.y,r*.62,0,Math.PI*2);ctx.stroke();
      }
    }
    scaleEl.textContent=zoom.toFixed(2)+"×";
  }

  const pointers=new Map();
  let dragStart=null,pinchStart=null;

  function midpoint(){
    const a=[...pointers.values()];
    return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
  }
  function distance(){
    const a=[...pointers.values()];
    return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
  }

  app.addEventListener("pointerdown",e=>{
    e.preventDefault();
    try{app.setPointerCapture(e.pointerId)}catch(_){}
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===1){
      dragStart={x:e.clientX,y:e.clientY,camX,camY};
    }else if(pointers.size===2){
      const m=midpoint();
      // This is the critical anchor: remember the WORLD point under the pinch midpoint.
      const anchor=screenToWorld(m.x,m.y);
      pinchStart={distance:distance(),zoom,anchor};
      dragStart=null;
    }
  },{passive:false});

  app.addEventListener("pointermove",e=>{
    if(!pointers.has(e.pointerId))return;
    e.preventDefault();
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

    if(pointers.size===1 && dragStart){
      camX=dragStart.camX+(e.clientX-dragStart.x);
      camY=dragStart.camY+(e.clientY-dragStart.y);
      draw();
    }else if(pointers.size===2 && pinchStart){
      const m=midpoint();
      const ratio=distance()/Math.max(1,pinchStart.distance);
      zoom=Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,pinchStart.zoom*ratio));
      // Keep the remembered world point directly under the CURRENT pinch midpoint.
      camX=m.x-pinchStart.anchor.x*zoom;
      camY=m.y-pinchStart.anchor.y*zoom;
      draw();
    }
  },{passive:false});

  function endPointer(e){
    if(!pointers.has(e.pointerId))return;
    e.preventDefault();pointers.delete(e.pointerId);
    if(pointers.size===1){
      const p=[...pointers.values()][0];
      dragStart={x:p.x,y:p.y,camX,camY};
      pinchStart=null;
    }else if(pointers.size===0){
      dragStart=null;pinchStart=null;
    }
  }
  app.addEventListener("pointerup",endPointer,{passive:false});
  app.addEventListener("pointercancel",endPointer,{passive:false});

  // Desktop/trackpad wheel zoom, also anchored under the cursor.
  app.addEventListener("wheel",e=>{
    e.preventDefault();
    const anchor=screenToWorld(e.clientX,e.clientY);
    const next=Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,zoom*Math.exp(-e.deltaY*.002)));
    zoom=next;
    camX=e.clientX-anchor.x*zoom;
    camY=e.clientY-anchor.y*zoom;
    draw();
  },{passive:false});

  app.addEventListener("contextmenu",e=>e.preventDefault());
  window.addEventListener("resize",resize,{passive:true});
  resize();
})();
</script>
</body>
</html>
